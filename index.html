<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="jarvis_ui.css">
</head>
<body>

<!-- ================= STARTUP ================= -->

<div id="startup">
  <div id="startupTitle">J.A.R.V.I.S.</div>
  <div id="startupText">
    INITIALIZING VOICE INTERFACE...
  </div>
</div>


<!-- ================= APP ================= -->

<div id="app">

  <header>
    <div id="gearBtn" title="Settings">
      <i class="fa-solid fa-gear"></i>
    </div>

    <b>J . A . R . V . I . S</b>
  </header>


  <div id="stage">

    <canvas id="matrix"></canvas>
    <canvas id="globe"></canvas>
    <canvas id="fx"></canvas>

    <div id="status">
      INITIALIZING
    </div>

  </div>


  <div id="transcript"></div>

</div>


<!-- ================= MICROPHONE ================= -->

<div id="mic" title="Talk">
  <i class="fa-solid fa-microphone"></i>
</div>


<!-- ================= SETTINGS ================= -->

<div id="overlay">

  <div id="panel">

    <h3>Settings</h3>


    <!-- API KEY -->

    <div class="field">

      <label>Groq API Key</label>

      <div class="keyBox">

        <input
          id="apiKey"
          type="password"
          placeholder="gsk_..."
          autocomplete="off"
        />

        <button
          id="toggleKey"
          type="button"
          aria-label="Show or hide API key"
        >
          <i class="fa-solid fa-eye"></i>
        </button>

      </div>

      <div id="keyHint">
        API key is cached locally in this browser.
      </div>

      <div id="keyStatus">
        No key loaded.
      </div>

    </div>


    <!-- LISTENING MODE -->

    <div class="field">

      <div class="modeTitle">
        Listening Mode
      </div>

      <div class="modeSwitch">

        <button
          id="autoMode"
          class="modeBtn active"
          type="button"
        >
          <i class="fa-solid fa-wave-square"></i>
          AUTOMATIC
        </button>

        <button
          id="manualMode"
          class="modeBtn"
          type="button"
        >
          <i class="fa-solid fa-hand-pointer"></i>
          PUSH TO TALK
        </button>

      </div>

      <div id="modeDescription" class="modeDescription">
        Automatic mode: J.A.R.V.I.S. keeps listening after each response.
      </div>

    </div>


    <!-- ACTIONS -->

    <div id="panelActions">

      <button id="saveKey">
        Save
      </button>

      <button id="closePanel">
        Close
      </button>

    </div>

  </div>

</div>


<script>

/* ============================================================
   CANVAS SYSTEM
============================================================ */

const matrixCanvas =
  document.getElementById('matrix');

const globeCanvas =
  document.getElementById('globe');

const fxCanvas =
  document.getElementById('fx');

const mctx =
  matrixCanvas.getContext('2d');

const ctx =
  globeCanvas.getContext('2d');

const fctx =
  fxCanvas.getContext('2d');


let W;
let H;
let DPR;
let SIZE;


function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  SIZE =
    Math.min(
      window.innerWidth * .9,
      window.innerHeight * .56,
      420
    );

  [
    matrixCanvas,
    globeCanvas,
    fxCanvas
  ].forEach(canvas => {

    canvas.width =
      SIZE * DPR;

    canvas.height =
      SIZE * DPR;

    canvas.style.width =
      SIZE + 'px';

    canvas.style.height =
      SIZE + 'px';

  });

  mctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  fctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  W = SIZE;
  H = SIZE;

  initMatrixCols();
}


window.addEventListener(
  'resize',
  resize
);


/* ============================================================
   MATRIX
============================================================ */

const chars =
  'アイウエオカキクケコサシスセソ01JARVIS'
  .split('');

let matrixCols = [];


function initMatrixCols(){

  const colW = 9;

  const n =
    Math.ceil(W / colW);

  matrixCols =
    new Array(n)
      .fill(0)
      .map(
        () => Math.random() * H
      );
}


function drawMatrix(){

  mctx.fillStyle =
    'rgba(2,6,10,.18)';

  mctx.fillRect(
    0,
    0,
    W,
    H
  );

  const colW = 9;

  mctx.font =
    '12px monospace';

  mctx.save();

  mctx.beginPath();

  mctx.arc(
    W / 2,
    H / 2,
    W * .46,
    0,
    Math.PI * 2
  );

  mctx.clip();


  for(
    let i = 0;
    i < matrixCols.length;
    i++
  ){

    const ch =
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];

    const x =
      i * colW;

    const y =
      matrixCols[i];

    const alpha =
      .15 + level * .5;

    mctx.fillStyle =
      `rgba(
        79,
        216,
        255,
        ${alpha.toFixed(2)}
      )`;

    mctx.fillText(
      ch,
      x,
      y
    );

    matrixCols[i] +=
      mode === 'idle'
        ? 3.2
        : 6 + level * 10;

    if(
      matrixCols[i] > H
    ){
      matrixCols[i] = -10;
    }

  }

  mctx.restore();
}


/* ============================================================
   PARTICLE GLOBE
============================================================ */

const N = 950;

const pts = [];


for(
  let i = 0;
  i < N;
  i++
){

  const y =
    1 -
    (i / (N - 1)) * 2;

  const r =
    Math.sqrt(1 - y * y);

  const theta =
    Math.PI *
    (1 + Math.sqrt(5)) *
    i;

  const x =
    Math.cos(theta) * r;

  const z =
    Math.sin(theta) * r;


  pts.push({

    x,
    y,
    z,

    jx:Math.random() - .5,
    jy:Math.random() - .5,
    jz:Math.random() - .5,

    spike:
      Math.random() < .08

  });

}


let level = 0;
let targetLevel = 0;
let rot = 0;

let mode = 'idle';


function drawGlobe(t){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const cx = W / 2;
  const cy = H / 2;

  const baseR =
    W * .30;


  level +=
    (targetLevel - level) *
    .08;


  const ambient =
    mode === 'idle'
      ? (
          Math.sin(t / 900) *
          .5 +
          .5
        ) * .15
      : 0;


  const pulse =
    level * .55 +
    ambient;


  rot +=
    .0022 +
    level * .005;


  const cosr =
    Math.cos(rot);

  const sinr =
    Math.sin(rot);


  const color =
    mode === 'speaking'
      ? [120,235,255]
      : mode === 'listening'
        ? [79,216,255]
        : [60,150,190];


  for(const p of pts){

    const jitter =
      level * 3;

    const spikeAmt =
      p.spike
        ? .15 + level * .6
        : 0;


    const px =
      p.x * (1 + spikeAmt) +
      p.jx * jitter * .02;

    const py =
      p.y * (1 + spikeAmt) +
      p.jy * jitter * .02;

    const pz =
      p.z * (1 + spikeAmt) +
      p.jz * jitter * .02;


    const x =
      px * cosr -
      pz * sinr;

    const z =
      px * sinr +
      pz * cosr;

    const y = py;


    const scale =
      (z + 2) / 3;


    const r =
      baseR *
      (1 + pulse * .18);


    const sx =
      cx + x * r;

    const sy =
      cy + y * r;


    const alpha =
      .25 + scale * .6;


    const size =
      (p.spike ? 1.1 : .6) +
      scale * 1.6 +
      level * 1.4;


    ctx.beginPath();

    ctx.fillStyle =
      `rgba(
        ${color[0]},
        ${color[1]},
        ${color[2]},
        ${alpha}
      )`;

    ctx.arc(
      sx,
      sy,
      size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  const grad =
    ctx.createRadialGradient(
      cx,
      cy,
      0,
      cx,
      cy,
      baseR * (1 + pulse * .6)
    );


  grad.addColorStop(
    0,
    `rgba(
      ${color[0]},
      ${color[1]},
      ${color[2]},
      ${.10 + level * .2}
    )`
  );

  grad.addColorStop(
    1,
    'rgba(0,0,0,0)'
  );


  ctx.fillStyle = grad;

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    baseR * 1.35,
    0,
    Math.PI * 2
  );

  ctx.fill();


  return {
    cx,
    cy,
    baseR:
      baseR * (1 + pulse * .18)
  };

}


/* ============================================================
   LIGHTNING FX
============================================================ */

let bolts = [];


function maybeSpawnBolt(
  cx,
  cy,
  r
){

  const chance =
    mode === 'idle'
      ? .01
      : .10 + level * .12;


  if(
    Math.random() < chance
  ){

    const a1 =
      Math.random() *
      Math.PI * 2;


    const segs = [];


    let x =
      cx +
      Math.cos(a1) *
      r *
      .9;

    let y =
      cy +
      Math.sin(a1) *
      r *
      .9;


    const steps =
      5 +
      Math.floor(
        Math.random() * 4
      );


    const outAngle =
      a1 +
      (Math.random() - .5) *
      1.2;


    for(
      let i = 0;
      i < steps;
      i++
    ){

      const dist =
        r *
        .55 *
        (i + 1) /
        steps;


      const wobble =
        (Math.random() - .5) *
        14;


      const nx =
        cx +
        Math.cos(outAngle) *
        dist +
        Math.cos(outAngle + Math.PI / 2) *
        wobble;


      const ny =
        cy +
        Math.sin(outAngle) *
        dist +
        Math.sin(outAngle + Math.PI / 2) *
        wobble;


      segs.push([
        x,
        y,
        nx,
        ny
      ]);


      x = nx;
      y = ny;

    }


    bolts.push({
      segs,
      life:1
    });

  }

}


function drawFx(
  cx,
  cy,
  r
){

  fctx.clearRect(
    0,
    0,
    W,
    H
  );


  maybeSpawnBolt(
    cx,
    cy,
    r
  );


  bolts.forEach(b => {

    fctx.strokeStyle =
      `rgba(
        232,
        251,
        255,
        ${b.life}
      )`;

    fctx.lineWidth = 1.4;

    fctx.shadowColor =
      'rgba(120,235,255,.9)';

    fctx.shadowBlur = 8;


    fctx.beginPath();


    b.segs.forEach(
      ([x1,y1,x2,y2]) => {

        fctx.moveTo(
          x1,
          y1
        );

        fctx.lineTo(
          x2,
          y2
        );

      }
    );


    fctx.stroke();

    fctx.shadowBlur = 0;

    b.life -= .12;

  });


  bolts =
    bolts.filter(
      b => b.life > 0
    );


  if(
    level > .55 &&
    Math.random() < .25
  ){

    fctx.strokeStyle =
      `rgba(
        79,
        216,
        255,
        ${.25 + level * .3}
      )`;

    fctx.lineWidth = 1;

    fctx.beginPath();

    fctx.arc(
      cx,
      cy,
      r *
      (1.1 + Math.random() * .3),
      0,
      Math.PI * 2
    );

    fctx.stroke();

  }

}


function frame(t){

  requestAnimationFrame(frame);

  drawMatrix();

  const {
    cx,
    cy,
    baseR
  } =
    drawGlobe(t);

  drawFx(
    cx,
    cy,
    baseR
  );

}


resize();

requestAnimationFrame(frame);


/* ============================================================
   UI
============================================================ */

const statusEl =
  document.getElementById('status');

const transcriptEl =
  document.getElementById('transcript');

const gearBtn =
  document.getElementById('gearBtn');

const overlay =
  document.getElementById('overlay');

const closePanel =
  document.getElementById('closePanel');

const apiKeyInput =
  document.getElementById('apiKey');

const toggleKey =
  document.getElementById('toggleKey');

const saveKeyBtn =
  document.getElementById('saveKey');

const keyStatus =
  document.getElementById('keyStatus');

const startup =
  document.getElementById('startup');

const micBtn =
  document.getElementById('mic');

const autoModeBtn =
  document.getElementById('autoMode');

const manualModeBtn =
  document.getElementById('manualMode');

const modeDescription =
  document.getElementById('modeDescription');


function setStatus(s){
  statusEl.textContent = s;
}


function setMode(m){

  mode = m;

  targetLevel =
    m === 'idle'
      ? 0
      : m === 'listening'
        ? .6
        : .7;

}


/* ============================================================
   TRANSCRIPT
============================================================ */

function clearTranscript(){

  transcriptEl.innerHTML = '';

}


function addUserLine(text){

  const div =
    document.createElement('div');

  div.className = 'you';

  div.textContent =
    '> ' + text;

  transcriptEl.appendChild(div);

  transcriptEl.scrollTop =
    transcriptEl.scrollHeight;

}


function addAiLine(text){

  const div =
    document.createElement('div');

  div.className = 'ai';

  div.textContent =
    '< ' + text;

  transcriptEl.appendChild(div);

  transcriptEl.scrollTop =
    transcriptEl.scrollHeight;

}


/* ============================================================
   SETTINGS
============================================================ */

gearBtn.addEventListener(
  'click',
  () =>
    overlay.classList.add('open')
);


closePanel.addEventListener(
  'click',
  () =>
    overlay.classList.remove('open')
);


overlay.addEventListener(
  'click',
  e => {

    if(e.target === overlay){
      overlay.classList.remove('open');
    }

  }
);


/* ============================================================
   API KEY SHOW / HIDE
============================================================ */

toggleKey.addEventListener(
  'click',
  () => {

    if(
      apiKeyInput.type === 'password'
    ){

      apiKeyInput.type = 'text';

      toggleKey.innerHTML =
        '<i class="fa-solid fa-eye-slash"></i>';

    }else{

      apiKeyInput.type = 'password';

      toggleKey.innerHTML =
        '<i class="fa-solid fa-eye"></i>';

    }

  }
);


/* ============================================================
   API KEY CACHE
============================================================ */

let groqKey = '';


function loadCachedKey(){

  try{

    const cached =
      localStorage.getItem(
        'jarvis_groq_api_key'
      );

    if(cached){

      groqKey = cached;

      apiKeyInput.value =
        cached;

      keyStatus.textContent =
        'API key loaded from local cache.';

    }else{

      keyStatus.textContent =
        'No cached API key.';

    }

  }catch(err){

    console.warn(
      'Could not access localStorage.',
      err
    );

    keyStatus.textContent =
      'Local cache unavailable.';

  }

}


function saveApiKey(){

  const value =
    apiKeyInput.value.trim();

  if(!value){

    groqKey = '';

    try{
      localStorage.removeItem(
        'jarvis_groq_api_key'
      );
    }catch(e){}

    keyStatus.textContent =
      'API key removed.';

    return;

  }


  groqKey = value;


  try{

    localStorage.setItem(
      'jarvis_groq_api_key',
      groqKey
    );

    keyStatus.textContent =
      'API key cached locally.';

  }catch(err){

    keyStatus.textContent =
      'Key active for this session only.';

  }

}


saveKeyBtn.addEventListener(
  'click',
  () => {

    saveApiKey();

    overlay.classList.remove(
      'open'
    );


    if(groqKey){

      clearTranscript();

      addAiLine(
        'Systems ready. Voice interface initialized.'
      );

      setTimeout(
        () => {

          if(
            listeningMode === 'auto'
          ){
            startListening();
          }

        },
        500
      );

    }

  }
);


/* ============================================================
   LISTENING MODE
============================================================ */

let listeningMode =
  'auto';


function setListeningMode(modeName){

  listeningMode =
    modeName;


  autoModeBtn.classList.toggle(
    'active',
    modeName === 'auto'
  );


  manualModeBtn.classList.toggle(
    'active',
    modeName === 'manual'
  );

  micBtn.style.display =
    modeName === 'manual'
      ? 'flex'
      : 'none';
  
  if(
    modeName === 'auto'
  ){

    modeDescription.textContent =
      'Automatic mode: J.A.R.V.I.S. continuously listens and resumes listening after each response.';

    if(!recognizing){
      startListening();
    }

  }else{

    modeDescription.textContent =
      'Push to Talk: press and hold the microphone while speaking. Release to stop.';

    stopListening();

  }

}


autoModeBtn.addEventListener(
  'click',
  () =>
    setListeningMode('auto')
);


manualModeBtn.addEventListener(
  'click',
  () =>
    setListeningMode('manual')
);


/* ============================================================
   SPEECH RECOGNITION
============================================================ */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognizing = false;
let recognition = null;

let suppressRestart = false;
let processingQuery = false;


if(SR){

  recognition =
    new SR();


  /*
    English is the default JARVIS language.

    en-US tends to work well on Android.
    We also use alternatives to reduce stupid
    transcription mistakes.
  */

  recognition.lang =
    'en-US';

  recognition.interimResults =
    false;

  recognition.continuous =
    false;

  recognition.maxAlternatives =
    5;


  recognition.onstart = () => {

    recognizing = true;

    setMode('listening');

    setStatus(
      'LISTENING'
    );

    micBtn.classList.add(
      'listening'
    );

  };


  recognition.onend = () => {

    recognizing = false;

    micBtn.classList.remove(
      'listening'
    );


    if(
      mode === 'listening'
    ){

      setMode('idle');

      setStatus(
        'STANDBY'
      );

    }


    /*
      Automatic mode automatically
      opens the microphone again.

      Manual mode never does this.
    */

    if(
      listeningMode === 'auto' &&
      !suppressRestart &&
      !processingQuery
    ){

      setTimeout(
        () => {

          if(
            listeningMode === 'auto' &&
            !recognizing &&
            !processingQuery
          ){

            startListening();

          }

        },
        300
      );

    }

  };


  recognition.onerror = e => {

    console.log(
      'Speech recognition:',
      e.error
    );


    recognizing = false;

    micBtn.classList.remove(
      'listening'
    );


    if(
      e.error === 'aborted'
    ){

      return;

    }


    if(
      e.error === 'not-allowed' ||
      e.error === 'service-not-allowed'
    ){

      setMode('idle');

      setStatus(
        'MIC PERMISSION DENIED'
      );

      return;

    }


    setMode('idle');

    setStatus(
      'MIC: ' + e.error
    );


    if(
      listeningMode === 'auto'
    ){

      setTimeout(
        startListening,
        1000
      );

    }

  };


  recognition.onresult = e => {

    /*
      Pick the highest-confidence
      alternative instead of blindly
      accepting result #0.
    */

    let bestText = '';
    let bestConfidence = -1;


    for(
      let i = 0;
      i < e.results[0].length;
      i++
    ){

      const result =
        e.results[0][i];


      const confidence =
        typeof result.confidence === 'number'
          ? result.confidence
          : 0;


      if(
        confidence > bestConfidence
      ){

        bestConfidence =
          confidence;

        bestText =
          result.transcript;
      }

    }


    let text =
      normalizeSpeech(
        bestText
      );


    if(!text){
      return;
    }


    /*
      Prevent duplicate processing.
    */

    if(
      processingQuery
    ){
      return;
    }


    processingQuery = true;


    /*
      Every new prompt clears
      the previous conversation
      from the UI.
    */

    clearTranscript();

    addUserLine(text);

    handleQuery(text);

  };

}else{

  setStatus(
    'SPEECH API NOT SUPPORTED'
  );

}


/* ============================================================
   SPEECH NORMALIZATION
============================================================ */

function normalizeSpeech(text){

  let t =
    text
      .trim()
      .replace(/\s+/g,' ');


  /*
    Browser speech engines sometimes
    turn "Hi Jarvis" into nonsense.
  */

  const corrections = [

    [
      /^high service$/i,
      'Hi Jarvis'
    ],

    [
      /^hi service$/i,
      'Hi Jarvis'
    ],

    [
      /^hey service$/i,
      'Hey Jarvis'
    ],

    [
      /^high jarvis$/i,
      'Hi Jarvis'
    ],

    [
      /^hi jarvis$/i,
      'Hi Jarvis'
    ],

    [
      /^hey jarvis$/i,
      'Hey Jarvis'
    ],

    [
      /^hi jervis$/i,
      'Hi Jarvis'
    ],

    [
      /^hey jervis$/i,
      'Hey Jarvis'
    ],

    [
      /^jarvis$/i,
      'Jarvis'
    ],

    [
      /^jervis$/i,
      'Jarvis'
    ]

  ];


  for(
    const [
      pattern,
      replacement
    ]
    of corrections
  ){

    if(
      pattern.test(t)
    ){

      return replacement;

    }

  }


  return t;

}


/* ============================================================
   START / STOP LISTENING
============================================================ */

function startListening(){

  if(!SR){

    setStatus(
      'SPEECH API NOT SUPPORTED'
    );

    return;

  }


  if(
    listeningMode !== 'auto' &&
    !manualPressing
  ){

    return;

  }


  if(
    recognizing ||
    processingQuery
  ){

    return;

  }


  suppressRestart =
    false;


  try{

    recognition.start();

  }catch(err){

    /*
      Browser throws InvalidStateError
      if recognition is already starting.
      Nothing needs to be done.
    */

  }

}


function stopListening(){

  suppressRestart =
    true;


  if(
    recognition &&
    recognizing
  ){

    try{

      recognition.stop();

    }catch(e){}

  }


  micBtn.classList.remove(
    'listening'
  );

}


/* ============================================================
   MANUAL PUSH TO TALK
============================================================ */

let manualPressing =
  false;


function manualStart(){

  if(
    listeningMode !== 'manual'
  ){

    return;

  }


  manualPressing =
    true;

  micBtn.classList.add(
    'manual-active'
  );


  if(
    recognition &&
    recognizing
  ){

    return;

  }


  suppressRestart =
    true;


  try{

    recognition.start();

  }catch(e){}

}


function manualStop(){

  if(
    listeningMode !== 'manual'
  ){

    return;

  }


  manualPressing =
    false;

  micBtn.classList.remove(
    'manual-active'
  );


  stopListening();

}


/*
  Pointer events work on both
  touchscreen and desktop.
*/

micBtn.addEventListener(
  'pointerdown',
  e => {

    if(
      listeningMode === 'manual'
    ){

      e.preventDefault();

      manualStart();

    }

  }
);


micBtn.addEventListener(
  'pointerup',
  e => {

    if(
      listeningMode === 'manual'
    ){

      e.preventDefault();

      manualStop();

    }

  }
);


micBtn.addEventListener(
  'pointercancel',
  () => {

    if(
      listeningMode === 'manual'
    ){

      manualStop();

    }

  }
);


micBtn.addEventListener(
  'pointerleave',
  e => {

    if(
      listeningMode === 'manual' &&
      manualPressing
    ){

      /*
        On desktop, leaving the button
        while holding it stops recording.
      */

      manualStop();

    }

  }
);


/*
  In automatic mode, tapping the mic
  can manually restart listening.
*/

micBtn.addEventListener(
  'click',
  () => {

    if(
      listeningMode !== 'auto'
    ){

      return;

    }


    if(
      recognizing
    ){

      stopListening();

    }else{

      startListening();

    }

  }
);


/* ============================================================
   TTS
============================================================ */

function getJarvisVoice(){

  const voices =
    speechSynthesis.getVoices();


  if(!voices.length){
    return null;
  }


  /*
    Prefer British male voices.
    Browser availability varies by device.
  */

  const preferred = [

    /daniel/i,
    /arthur/i,
    /oliver/i,
    /george/i,
    /brian/i,
    /ryan/i,
    /google uk english male/i

  ];


  for(
    const pattern
    of preferred
  ){

    const voice =
      voices.find(
        v =>
          pattern.test(v.name) &&
          /^en(-|_)/i.test(v.lang)
      );


    if(voice){
      return voice;
    }

  }


  return (
    voices.find(
      v =>
        /^en-GB/i.test(v.lang)
    ) ||

    voices.find(
      v =>
        /^en-US/i.test(v.lang)
    ) ||

    voices.find(
      v =>
        /^en/i.test(v.lang)
    ) ||

    voices[0]
  );

}


speechSynthesis.onvoiceschanged =
  () => {

    getJarvisVoice();

  };


function speak(text){

  suppressRestart =
    true;


  if(
    recognition &&
    recognizing
  ){

    try{

      recognition.stop();

    }catch(e){}

  }


  speechSynthesis.cancel();


  setMode(
    'speaking'
  );

  setStatus(
    'RESPONDING'
  );


  const utter =
    new SpeechSynthesisUtterance(
      text
    );


  utter.lang =
    'en-GB';

  utter.rate =
    .92;

  utter.pitch =
    .78;

  utter.volume =
    1;


  const voice =
    getJarvisVoice();


  if(voice){

    utter.voice =
      voice;

    utter.lang =
      voice.lang;

  }


  utter.onstart =
    () => {

      setStatus(
        'RESPONDING'
      );

    };


  utter.onend =
    () => {

      setMode(
        'idle'
      );

      setStatus(
        'STANDBY'
      );

      processingQuery =
        false;

      suppressRestart =
        false;


      if(
        listeningMode === 'auto'
      ){

        setTimeout(
          startListening,
          350
        );

      }

    };


  utter.onerror =
    () => {

      setMode(
        'idle'
      );

      setStatus(
        'STANDBY'
      );

      processingQuery =
        false;

      suppressRestart =
        false;


      if(
        listeningMode === 'auto'
      ){

        setTimeout(
          startListening,
          350
        );

      }

    };


  speechSynthesis.speak(
    utter
  );

}

/* ============================================================
   GROQ
============================================================ */

async function handleQuery(
  userText
){

  if(!groqKey){

    const msg =
      'Please configure the Groq API key in Settings.';

    addAiLine(msg);

    speak(msg);

    processingQuery =
      false;

    return;

  }


  setStatus(
    'THINKING'
  );

  targetLevel =
    .35;


  try{

    const res =
      await fetch(
        'https://api.groq.com/openai/v1/chat/completions',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json',

            'Authorization':
              'Bearer ' + groqKey
          },

          body:JSON.stringify({

            model:
              'llama-3.3-70b-versatile',

            max_tokens:
              500,

            temperature:
              .65,

            messages:[

              {
                role:'system',

                content:
                  JARVIS_SYSTEM_PROMPT
              },

              {
                role:'user',

                content:
                  userText
              }

            ]

          })

        }
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data?.error?.message ||
        'API request failed'
      );

    }


    const text =
      data
        ?.choices?.[0]
        ?.message
        ?.content
        ?.trim();


    if(!text){

      throw new Error(
        'Empty AI response'
      );

    }


    addAiLine(text);

    speak(text);


  }catch(err){

    console.error(
      'JARVIS AI error:',
      err
    );


    const errorText =
      'I am unable to connect to the AI service at the moment.';


    addAiLine(
      errorText
    );

    speak(
      errorText
    );

  }

}


/* ============================================================
   INITIALIZATION
============================================================ */

function initializeJarvis(){

  loadCachedKey();


  setMode(
    'listening'
  );


  setStatus(
    'INITIALIZING'
  );


  setTimeout(
    () => {

      startup.classList.add(
        'hidden'
      );


      if(
        listeningMode === 'auto'
      ){

        startListening();

      }else{

        setStatus(
          'STANDBY'
        );

      }

    },
    900
  );

}


window.addEventListener(
  'load',
  initializeJarvis
);
