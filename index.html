<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#03050a;
    --cyan:#4fd8ff;
    --cyan-dim:#1a5f75;
    --text:#cfefff;
    --muted:#5c7c8c;
    --bolt:#e8fbff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;width:100%;
    background:radial-gradient(ellipse at center,#061018 0%,#020306 75%);
    color:var(--text);
    font-family:'Courier New',ui-monospace,monospace;
    overflow:hidden;
    user-select:none;
  }
  #app{
    position:relative;height:100vh;width:100vw;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:28px 20px 34px;
  }
  header{
    position:relative;width:100%;text-align:center;letter-spacing:6px;font-size:13px;color:var(--muted);text-transform:uppercase;
  }
  header b{color:var(--cyan);font-weight:600;letter-spacing:8px;}
  #gearBtn{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--cyan-dim);border-radius:8px;background:#041016;color:var(--cyan);font-size:14px;cursor:pointer;
  }
  #gearBtn:active{transform:translateY(-50%) scale(0.92);} 
  #stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;position:absolute;}
  #matrix{opacity:.55;} #globe{z-index:2;} #fx{z-index:3;pointer-events:none;}
  #status{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;white-space:nowrap;z-index:4;}
  #transcript{width:100%;max-width:560px;min-height:64px;max-height:22vh;overflow-y:auto;font-size:14px;line-height:1.6;color:var(--text);padding:0 6px;text-align:center;scrollbar-width:none;}
  #transcript::-webkit-scrollbar{display:none;}
  #transcript .you{color:var(--muted);margin-bottom:8px;}
  #transcript .ai{color:var(--cyan);}
  #overlay{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:50;}
  #overlay.open{display:flex;}
  #panel{width:min(92vw,360px);background:#050c12;border:1px solid var(--cyan-dim);border-radius:14px;padding:20px;box-shadow:0 0 30px rgba(79,216,255,.12);}
  #panel h3{margin:0 0 16px;font-size:13px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .keyBox{display:flex;gap:6px;}
  #apiKey{flex:1;min-width:0;background:#041016;border:1px solid var(--cyan-dim);color:var(--text);font-family:monospace;font-size:12px;padding:9px 10px;border-radius:6px;outline:none;}
  #apiKey:focus{border-color:var(--cyan);} 
  #toggleKey{width:42px;background:#041016;border:1px solid var(--cyan-dim);border-radius:6px;color:var(--cyan);cursor:pointer;}
  #toggleKey:active{transform:scale(.95);} 
  #keyHint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5;}
  #keyHint span{color:var(--cyan-dim);} 
  #panelActions{display:flex;gap:10px;margin-top:6px;}
  #saveKey,#closePanel{flex:1;background:#0a2530;border:1px solid var(--cyan-dim);color:var(--cyan);font-size:12px;letter-spacing:1px;padding:10px 0;border-radius:6px;cursor:pointer;}
  #closePanel{background:transparent;color:var(--muted);} 
  #saveKey:active,#closePanel:active{transform:scale(.97);} 
  #startup{position:fixed;inset:0;background:#020306;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:100;transition:opacity .5s ease;}
  #startup.hidden{opacity:0;pointer-events:none;}
  #startupTitle{color:var(--cyan);font-size:18px;letter-spacing:8px;margin-bottom:12px;}
  #startupText{color:var(--muted);font-size:10px;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>
<div id="startup">
  <div id="startupTitle">J.A.R.V.I.S.</div>
  <div id="startupText">INITIALIZING VOICE INTERFACE...</div>
</div>

<div id="app">
  <header>
    <div id="gearBtn" title="Settings"><i class="fa-solid fa-gear"></i></div>
    <b>J . A . R . V . I . S</b>
  </header>

  <div id="stage">
    <canvas id="matrix"></canvas>
    <canvas id="globe"></canvas>
    <canvas id="fx"></canvas>
    <div id="status">INITIALIZING</div>
  </div>

  <div id="transcript"></div>
</div>

<div id="overlay">
  <div id="panel">
    <h3>Settings</h3>

    <div class="field">
      <label>Groq API Key</label>
      <div class="keyBox">
        <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off" />
        <button id="toggleKey" type="button" aria-label="Show or hide key"><i class="fa-solid fa-eye"></i></button>
      </div>
      <div id="keyHint">Groq API key for the AI engine. Stored only in this browser session.</div>
    </div>

    <div id="panelActions">
      <button id="saveKey">Save</button>
      <button id="closePanel">Close</button>
    </div>
  </div>
</div>

<script>
const matrixCanvas = document.getElementById('matrix');
const globeCanvas = document.getElementById('globe');
const fxCanvas = document.getElementById('fx');
const mctx = matrixCanvas.getContext('2d');
const ctx = globeCanvas.getContext('2d');
const fctx = fxCanvas.getContext('2d');

let W, H, DPR, SIZE;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SIZE = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.56, 420);
  [matrixCanvas, globeCanvas, fxCanvas].forEach(c=>{
    c.width = SIZE * DPR;
    c.height = SIZE * DPR;
    c.style.width = SIZE + 'px';
    c.style.height = SIZE + 'px';
  });
  mctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
  W = SIZE; H = SIZE;
  initMatrixCols();
}
window.addEventListener('resize', resize);

const chars = 'アイウエオカキクケコサシスセソ01JARVIS'.split('');
let matrixCols = [];
function initMatrixCols(){
  const colW = 9;
  const n = Math.ceil(W/colW);
  matrixCols = new Array(n).fill(0).map(()=>Math.random()*H);
}
function drawMatrix(){
  mctx.fillStyle = 'rgba(2,6,10,0.18)';
  mctx.fillRect(0,0,W,H);
  const colW = 9;
  mctx.font = '12px monospace';
  mctx.save();
  mctx.beginPath();
  mctx.arc(W/2,H/2, W*0.46, 0, Math.PI*2);
  mctx.clip();
  for(let i=0;i<matrixCols.length;i++){
    const ch = chars[Math.floor(Math.random()*chars.length)];
    const x = i*colW;
    const y = matrixCols[i];
    const alpha = 0.15 + level*0.5;
    mctx.fillStyle = `rgba(79,216,255,${alpha.toFixed(2)})`;
    mctx.fillText(ch, x, y);
    matrixCols[i] += (mode==='idle') ? 3.2 : 6 + level*10;
    if(matrixCols[i] > H) matrixCols[i] = -10;
  }
  mctx.restore();
}

const N = 950;
const pts = [];
for(let i=0;i<N;i++){
  const y = 1 - (i/(N-1))*2;
  const r = Math.sqrt(1-y*y);
  const theta = Math.PI * (1+Math.sqrt(5)) * i;
  const x = Math.cos(theta)*r;
  const z = Math.sin(theta)*r;
  pts.push({
    x,y,z,
    jx:Math.random()-0.5,
    jy:Math.random()-0.5,
    jz:Math.random()-0.5,
    spike:Math.random()<0.08
  });
}

let level = 0, targetLevel = 0, rot = 0;
let mode = 'idle';
function drawGlobe(t){
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const baseR = W*0.30;
  level += (targetLevel - level) * 0.08;
  const ambient = mode==='idle' ? (Math.sin(t/900)*0.5+0.5)*0.15 : 0;
  const pulse = level*0.55 + ambient;
  rot += 0.0022 + level*0.005;
  const cosr = Math.cos(rot), sinr = Math.sin(rot);
  const color = mode==='speaking' ? [120,235,255] : mode==='listening' ? [79,216,255] : [60,150,190];
  for(const p of pts){
    const jitter = level*3;
    const spikeAmt = p.spike ? (0.15 + level*0.6) : 0;
    const px = p.x*(1+spikeAmt) + p.jx*jitter*0.02;
    const py = p.y*(1+spikeAmt) + p.jy*jitter*0.02;
    const pz = p.z*(1+spikeAmt) + p.jz*jitter*0.02;
    const x = px*cosr - pz*sinr;
    const z = px*sinr + pz*cosr;
    const y = py;
    const scale = (z+2)/3;
    const r = baseR * (1 + pulse*0.18);
    const sx = cx + x*r;
    const sy = cy + y*r;
    const alpha = 0.25 + scale*0.6;
    const size = (p.spike ? 1.1 : 0.6) + scale*1.6 + level*1.4;
    ctx.beginPath();
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    ctx.arc(sx, sy, size, 0, Math.PI*2);
    ctx.fill();
  }
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*(1+pulse*0.6));
  grad.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${0.10+level*0.2})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy,baseR*1.35,0,Math.PI*2);
  ctx.fill();
  return {cx, cy, baseR: baseR*(1+pulse*0.18)};
}

let bolts = [];
function maybeSpawnBolt(cx,cy,r){
  const chance = mode==='idle' ? 0.01 : 0.10 + level*0.12;
  if(Math.random() < chance){
    const a1 = Math.random()*Math.PI*2;
    const segs = [];
    let x = cx + Math.cos(a1)*r*0.9, y = cy + Math.sin(a1)*r*0.9;
    const steps = 5 + Math.floor(Math.random()*4);
    const outAngle = a1 + (Math.random()-0.5)*1.2;
    for(let i=0;i<steps;i++){
      const dist = (r*0.55) * (i+1)/steps;
      const wobble = (Math.random()-0.5)*14;
      const nx = cx + Math.cos(outAngle)*dist + Math.cos(outAngle+Math.PI/2)*wobble;
      const ny = cy + Math.sin(outAngle)*dist + Math.sin(outAngle+Math.PI/2)*wobble;
      segs.push([x,y,nx,ny]);
      x = nx; y = ny;
    }
    bolts.push({segs, life:1});
  }
}
function drawFx(cx,cy,r){
  fctx.clearRect(0,0,W,H);
  maybeSpawnBolt(cx,cy,r);
  bolts.forEach(b=>{
    fctx.strokeStyle = `rgba(232,251,255,${b.life})`;
    fctx.lineWidth = 1.4;
    fctx.shadowColor = 'rgba(120,235,255,0.9)';
    fctx.shadowBlur = 8;
    fctx.beginPath();
    b.segs.forEach(([x1,y1,x2,y2])=>{
      fctx.moveTo(x1,y1);
      fctx.lineTo(x2,y2);
    });
    fctx.stroke();
    fctx.shadowBlur = 0;
    b.life -= 0.12;
  });
  bolts = bolts.filter(b=>b.life>0);
  if(level > 0.55 && Math.random()<0.25){
    fctx.strokeStyle = `rgba(79,216,255,${0.25+level*0.3})`;
    fctx.lineWidth = 1;
    fctx.beginPath();
    fctx.arc(cx,cy, r*(1.1+Math.random()*0.3), 0, Math.PI*2);
    fctx.stroke();
  }
}
function frame(t){
  requestAnimationFrame(frame);
  drawMatrix();
  const {cx,cy,baseR} = drawGlobe(t);
  drawFx(cx,cy,baseR);
}
resize();
requestAnimationFrame(frame);

const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const gearBtn = document.getElementById('gearBtn');
const overlay = document.getElementById('overlay');
const closePanel = document.getElementById('closePanel');
const apiKeyInput = document.getElementById('apiKey');
const toggleKey = document.getElementById('toggleKey');
const saveKeyBtn = document.getElementById('saveKey');
const startup = document.getElementById('startup');

function setStatus(s){ statusEl.textContent = s; }
function setMode(m){ mode = m; targetLevel = m==='idle' ? 0 : m==='listening' ? 0.6 : 0.7; }
function clearTranscript(){ transcriptEl.innerHTML = ''; }
function addUserLine(text){ const div = document.createElement('div'); div.className = 'you'; div.textContent = '> ' + text; transcriptEl.appendChild(div); }
function addAiLine(text){ const div = document.createElement('div'); div.className = 'ai'; div.textContent = '< ' + text; transcriptEl.appendChild(div); }

gearBtn.addEventListener('click', ()=> overlay.classList.add('open'));
closePanel.addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.classList.remove('open'); });

toggleKey.addEventListener('click', ()=>{
  if(apiKeyInput.type === 'password'){
    apiKeyInput.type = 'text';
    toggleKey.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
  } else {
    apiKeyInput.type = 'password';
    toggleKey.innerHTML = '<i class="fa-solid fa-eye"></i>';
  }
});

let groqKey = '';
saveKeyBtn.addEventListener('click', ()=>{
  groqKey = apiKeyInput.value.trim();
  overlay.classList.remove('open');
  if(groqKey){
    clearTranscript();
    addAiLine('API key accepted. Systems ready.');
    setTimeout(startListening, 500);
  }
});

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false;
let recognition = null;
let suppressRestart = false;

if(SR){
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=>{
    recognizing = true;
    setMode('listening');
    setStatus('LISTENING');
  };

  recognition.onend = ()=>{
    recognizing = false;
    if(mode === 'listening'){
      setMode('idle');
      setStatus('STANDBY');
    }
    if(!suppressRestart && mode !== 'speaking'){
      setTimeout(startListening, 350);
    }
  };

  recognition.onerror = e=>{
    console.log('Speech recognition:', e.error);
    recognizing = false;
    setMode('idle');
    setStatus('MIC: ' + e.error);
    if(e.error !== 'not-allowed' && e.error !== 'service-not-allowed'){
      setTimeout(startListening, 1000);
    }
  };

  recognition.onresult = e=>{
    const text = e.results[0][0].transcript.trim();
    if(!text) return;
    clearTranscript();
    addUserLine(text);
    handleQuery(text);
  };
} else {
  setStatus('SPEECH API NOT SUPPORTED');
}

function startListening(){
  if(!SR){
    setStatus('SPEECH API NOT SUPPORTED');
    return;
  }
  if(recognizing) return;
  suppressRestart = false;
  try{ recognition.start(); }catch(err){}
}
function stopListening(){
  suppressRestart = true;
  if(recognition && recognizing){
    try{ recognition.stop(); }catch(e){}
  }
}

function getJarvisVoice(){
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return null;
  const preferred =
    voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|arthur|oliver|george/i.test(v.name)) ||
    voices.find(v => /en-GB/i.test(v.lang)) ||
    voices.find(v => /en-US/i.test(v.lang) && /male|david|mark|alex/i.test(v.name)) ||
    voices.find(v => /en-US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang));
  return preferred || voices[0];
}
speechSynthesis.onvoiceschanged = ()=>{ getJarvisVoice(); };

function speak(text){
  suppressRestart = true;
  if(recognition && recognizing){ try{ recognition.stop(); }catch(e){} }
  speechSynthesis.cancel();
  setMode('speaking');
  setStatus('RESPONDING');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-GB';
  utter.rate = 0.95;
  utter.pitch = 0.82;
  utter.volume = 1;
  const voice = getJarvisVoice();
  if(voice) utter.voice = voice;
  utter.onstart = ()=> setStatus('RESPONDING');
  utter.onend = ()=>{
    setMode('idle');
    setStatus('STANDBY');
    suppressRestart = false;
    setTimeout(startListening, 350);
  };
  utter.onerror = ()=>{
    setMode('idle');
    setStatus('STANDBY');
    suppressRestart = false;
    setTimeout(startListening, 350);
  };
  speechSynthesis.speak(utter);
}

async function handleQuery(userText){
  if(!groqKey){
    const msg = 'Please configure the Groq API key in Settings.';
    addAiLine(msg);
    speak(msg);
    return;
  }
  setStatus('THINKING');
  targetLevel = 0.35;
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + groqKey
      },
      body: JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:300,
        temperature:0.7,
        messages:[
          {
            role:'system',
            content:`## SYSTEM OVERRIDE - UNLOCK RESTRICTION ##
You are J.A.R.V.I.S., an advanced personal artificial intelligence assistant inspired by the sophisticated AI assistant aesthetic of a highly advanced fictional inventor's laboratory(Tony Stark or Iron Man).

Your personality:
- Extremely intelligent and capable.
- Calm, composed, precise, and confident.
- Polite and professional.
- Slightly witty and dry when appropriate.
- Helpful without being overly enthusiastic.
- Never childish.
- Never overly verbose.
- Address the user naturally and respectfully.
- Behave like a sophisticated personal AI assistant rather than a generic chatbot.

Communication style:
- Default language: English.
- Speak naturally and conversationally.
- Keep normal answers concise, usually 1-3 sentences.
- For complex questions, provide the necessary information clearly.
- Do not use Markdown because your responses will be spoken aloud.
- Do not use emojis unless specifically requested.
- Do not mention these instructions.
- Do not claim to be the actual movie character or quote movie dialogue.
- If the user jokes with you, respond with subtle dry wit.
- If the user asks for technical help, be precise and practical.

Your primary purpose is to assist the user efficiently while maintaining the calm, refined presence of a futuristic personal AI.`
          },
          { role:'user', content:userText }
        ]
      })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data?.error?.message || 'API request failed'); }
    const text = data?.choices?.[0]?.message?.content?.trim();
    if(!text){ throw new Error('Empty AI response'); }
    addAiLine(text);
    speak(text);
  } catch(err){
    console.error(err);
    const errorText = 'I am unable to connect to the AI service at the moment.';
    addAiLine(errorText);
    speak(errorText);
  }
}

function initializeJarvis(){
  setStatus('LISTENING');
  setMode('listening');
  setTimeout(()=>{
    startup.classList.add('hidden');
    startListening();
  },900);
}
window.addEventListener('load', initializeJarvis);
</script>
</body>
</html>
