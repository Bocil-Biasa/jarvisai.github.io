<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
  :root{
    --bg:#03050a;
    --cyan:#4fd8ff;
    --cyan-dim:#1a5f75;
    --text:#cfefff;
    --muted:#5c7c8c;
    --bolt:#e8fbff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; width:100%;
    background:radial-gradient(ellipse at center, #061018 0%, #020306 75%);
    color:var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow:hidden;
    user-select:none;
  }
  #app{
    position:relative; height:100vh; width:100vw;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:28px 20px 34px;
  }
  header{
    position:relative;
    width:100%;
    text-align:center;
    letter-spacing:6px;
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
  }
  header b{ color:var(--cyan); font-weight:600; letter-spacing:8px; }

  #gearBtn{
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%);
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--cyan-dim);
    border-radius:8px;
    background:#041016;
    color:var(--cyan);
    font-size:16px;
    cursor:pointer;
  }
  #gearBtn:active{ transform:translateY(-50%) scale(0.92); }

  #stage{
    position:relative;
    flex:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{ display:block; position:absolute; }
  #matrix{ opacity:0.55; }
  #globe{ z-index:2; }
  #fx{ z-index:3; pointer-events:none; }

  #status{
    position:absolute;
    bottom:6px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
    white-space:nowrap;
    z-index:4;
  }

  #transcript{
    width:100%;
    max-width:560px;
    min-height:64px;
    max-height:22vh;
    overflow-y:auto;
    font-size:14px;
    line-height:1.6;
    color:var(--text);
    padding:0 6px;
    text-align:center;
  }
  #transcript .you{ color:var(--muted); }
  #transcript .ai{ color:var(--cyan); }

  #controls{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:16px;
  }
  #mic{
    width:74px; height:74px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #103042, #041016 70%);
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 0 0 0 rgba(79,216,255,0.5);
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  #mic.listening{
    border-color:var(--cyan);
    box-shadow:0 0 18px 4px rgba(79,216,255,0.35);
    animation:breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ box-shadow:0 0 18px 4px rgba(79,216,255,0.25); }
    50%{ box-shadow:0 0 26px 8px rgba(79,216,255,0.55); }
  }
  #mic:active{ transform:scale(0.94); }

  #hint{
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    text-align:center;
    max-width:520px;
    padding:0 12px;
    margin-top:10px;
  }

  /* ---- Settings modal ---- */
  #overlay{
    position:fixed; inset:0;
    background:rgba(2,4,8,0.72);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
  }
  #overlay.open{ display:flex; }
  #panel{
    width:min(92vw, 360px);
    background:#050c12;
    border:1px solid var(--cyan-dim);
    border-radius:14px;
    padding:20px;
    box-shadow:0 0 30px rgba(79,216,255,0.12);
  }
  #panel h3{
    margin:0 0 16px;
    font-size:13px;
    letter-spacing:3px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  #apiKey{
    width:100%;
    background:#041016;
    border:1px solid var(--cyan-dim);
    color:var(--text);
    font-family:monospace;
    font-size:12px;
    padding:9px 10px;
    border-radius:6px;
    outline:none;
  }
  #apiKey:focus{ border-color:var(--cyan); }
  #keyHint{
    font-size:10px;
    color:var(--muted);
    margin-top:6px;
    line-height:1.5;
  }
  #keyHint span{ color:var(--cyan-dim); }

  .switchRow{
    display:flex; align-items:center; justify-content:space-between;
  }
  .switchRow .lbl{ font-size:12px; color:var(--text); }
  .switchRow .sub{ font-size:10px; color:var(--muted); margin-top:2px; }
  #modeSwitch{
    position:relative;
    width:52px; height:28px;
    background:#0a1c26;
    border:1px solid var(--cyan-dim);
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
  }
  #modeSwitch .knob{
    position:absolute; top:2px; left:2px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--cyan-dim);
    transition:left .18s ease, background .18s ease;
  }
  #modeSwitch.auto .knob{
    left:26px;
    background:var(--cyan);
    box-shadow:0 0 8px rgba(79,216,255,0.7);
  }

  #panelActions{
    display:flex; gap:10px; margin-top:6px;
  }
  #saveKey, #closePanel{
    flex:1;
    background:#0a2530;
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    font-size:12px;
    letter-spacing:1px;
    padding:10px 0;
    border-radius:6px;
    cursor:pointer;
  }
  #closePanel{ background:transparent; color:var(--muted); }
  #saveKey:active, #closePanel:active{ transform:scale(0.97); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="gearBtn" title="Settings">⚙</div>
    <b>J . A . R . V . I . S</b>
  </header>

  <div id="stage">
    <canvas id="matrix"></canvas>
    <canvas id="globe"></canvas>
    <canvas id="fx"></canvas>
    <div id="status">STANDBY</div>
  </div>

  <div id="transcript"></div>

  <div id="controls">
    <div id="mic" title="Tap or hold to talk">🎙</div>
  </div>
  <div id="hint" id="hintText">Auto mode: just talk. Voice runs on your browser's built-in speech engine.</div>
</div>

<div id="overlay">
  <div id="panel">
    <h3>Settings</h3>

    <div class="field">
      <label>Groq API Key</label>
      <input id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
      <div id="keyHint">Free key at <span>console.groq.com/keys</span> — stored only in this browser tab.</div>
    </div>

    <div class="field switchRow">
      <div>
        <div class="lbl">Listening mode</div>
        <div class="sub" id="modeSub">Auto — just start talking</div>
      </div>
      <div id="modeSwitch" class="auto"><div class="knob"></div></div>
    </div>

    <div id="panelActions">
      <button id="saveKey">Save</button>
      <button id="closePanel">Close</button>
    </div>
  </div>
</div>

<script>
/* ================= Canvas layers ================= */
const stage = document.getElementById('stage');
const matrixCanvas = document.getElementById('matrix');
const globeCanvas = document.getElementById('globe');
const fxCanvas = document.getElementById('fx');
const mctx = matrixCanvas.getContext('2d');
const ctx = globeCanvas.getContext('2d');
const fctx = fxCanvas.getContext('2d');

let W, H, DPR, SIZE;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SIZE = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.56, 420);
  [matrixCanvas, globeCanvas, fxCanvas].forEach(c=>{
    c.width = SIZE * DPR;
    c.height = SIZE * DPR;
    c.style.width = SIZE + 'px';
    c.style.height = SIZE + 'px';
  });
  mctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.setTransform(DPR,0,0,DPR,0,0);
  W = SIZE; H = SIZE;
  initMatrixCols();
}
window.addEventListener('resize', resize);

/* ---------- Matrix rain (background layer, circular clipped) ---------- */
const chars = 'アイウエオカキクケコサシスセソ01アルゴリズムJARVIS'.split('');
let matrixCols = [];
function initMatrixCols(){
  const colW = 9;
  const n = Math.ceil(W/colW);
  matrixCols = new Array(n).fill(0).map(()=> Math.random()*H);
}
function drawMatrix(){
  mctx.fillStyle = 'rgba(2,6,10,0.18)';
  mctx.fillRect(0,0,W,H);
  const colW = 9;
  mctx.font = '12px monospace';
  mctx.save();
  mctx.beginPath();
  mctx.arc(W/2,H/2, W*0.46, 0, Math.PI*2);
  mctx.clip();
  for(let i=0;i<matrixCols.length;i++){
    const ch = chars[Math.floor(Math.random()*chars.length)];
    const x = i*colW;
    const y = matrixCols[i];
    const alpha = 0.15 + level*0.5;
    mctx.fillStyle = `rgba(79,216,255,${alpha.toFixed(2)})`;
    mctx.fillText(ch, x, y);
    matrixCols[i] += (mode==='idle') ? 3.2 : 6 + level*10;
    if(matrixCols[i] > H) matrixCols[i] = -10;
  }
  mctx.restore();
}

/* ---------- Particle globe (fibonacci sphere) ---------- */
const N = 950;
const pts = [];
for(let i=0;i<N;i++){
  const y = 1 - (i / (N-1)) * 2;
  const r = Math.sqrt(1 - y*y);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const x = Math.cos(theta) * r;
  const z = Math.sin(theta) * r;
  pts.push({x,y,z, jx:(Math.random()-0.5), jy:(Math.random()-0.5), jz:(Math.random()-0.5), spike: Math.random()<0.08});
}

let level = 0, targetLevel = 0, rot = 0;
let mode = 'idle'; // idle | listening | speaking

function drawGlobe(t){
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const baseR = W*0.30;

  level += (targetLevel - level) * 0.08;
  const ambient = mode==='idle' ? (Math.sin(t/900)*0.5+0.5)*0.15 : 0;
  const pulse = level*0.55 + ambient;

  rot += 0.0022 + level*0.005;
  const cosr = Math.cos(rot), sinr = Math.sin(rot);
  const color = mode==='speaking' ? [120,235,255] : mode==='listening' ? [79,216,255] : [60,150,190];

  for(const p of pts){
    const jitter = level*3;
    const spikeAmt = p.spike ? (0.15 + level*0.6) : 0;
    const px = p.x*(1+spikeAmt) + p.jx*jitter*0.02;
    const py = p.y*(1+spikeAmt) + p.jy*jitter*0.02;
    const pz = p.z*(1+spikeAmt) + p.jz*jitter*0.02;

    const x = px*cosr - pz*sinr;
    const z = px*sinr + pz*cosr;
    const y = py;

    const scale = (z+2)/3;
    const r = baseR * (1 + pulse*0.18);
    const sx = cx + x*r;
    const sy = cy + y*r;

    const alpha = 0.25 + scale*0.6;
    const size = (p.spike ? 1.1 : 0.6) + scale*1.6 + level*1.4;

    ctx.beginPath();
    ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    ctx.arc(sx, sy, size, 0, Math.PI*2);
    ctx.fill();
  }

  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*(1+pulse*0.6));
  grad.addColorStop(0, `rgba(${color[0]},${color[1]},${color[2]},${0.10+level*0.2})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx,cy,baseR*1.35,0,Math.PI*2);
  ctx.fill();

  return {cx, cy, baseR: baseR*(1+pulse*0.18)};
}

/* ---------- Lightning FX layer ---------- */
let bolts = [];
function maybeSpawnBolt(cx,cy,r){
  const chance = mode==='idle' ? 0.01 : 0.10 + level*0.12;
  if(Math.random() < chance){
    const a1 = Math.random()*Math.PI*2;
    const segs = [];
    let x = cx + Math.cos(a1)*r*0.9, y = cy + Math.sin(a1)*r*0.9;
    const steps = 5 + Math.floor(Math.random()*4);
    const outAngle = a1 + (Math.random()-0.5)*1.2;
    for(let i=0;i<steps;i++){
      const dist = (r*0.55) * (i+1)/steps;
      const wobble = (Math.random()-0.5)*14;
      const nx = cx + Math.cos(outAngle)*dist + Math.cos(outAngle+Math.PI/2)*wobble;
      const ny = cy + Math.sin(outAngle)*dist + Math.sin(outAngle+Math.PI/2)*wobble;
      segs.push([x,y,nx,ny]);
      x = nx; y = ny;
    }
    bolts.push({segs, life:1});
  }
}
function drawFx(cx,cy,r){
  fctx.clearRect(0,0,W,H);
  maybeSpawnBolt(cx,cy,r);
  bolts.forEach(b=>{
    fctx.strokeStyle = `rgba(232,251,255,${b.life})`;
    fctx.lineWidth = 1.4;
    fctx.shadowColor = 'rgba(120,235,255,0.9)';
    fctx.shadowBlur = 8;
    fctx.beginPath();
    b.segs.forEach(([x1,y1,x2,y2])=>{
      fctx.moveTo(x1,y1);
      fctx.lineTo(x2,y2);
    });
    fctx.stroke();
    fctx.shadowBlur = 0;
    b.life -= 0.12;
  });
  bolts = bolts.filter(b=>b.life>0);

  // ring pulse when speaking/listening kicks in hard
  if(level > 0.55 && Math.random()<0.25){
    fctx.strokeStyle = `rgba(79,216,255,${0.25+level*0.3})`;
    fctx.lineWidth = 1;
    fctx.beginPath();
    fctx.arc(cx,cy, r*(1.1+Math.random()*0.3), 0, Math.PI*2);
    fctx.stroke();
  }
}

function frame(t){
  requestAnimationFrame(frame);
  drawMatrix();
  const {cx,cy,baseR} = drawGlobe(t);
  drawFx(cx,cy,baseR);
}
resize();
requestAnimationFrame(frame);

/* ================= UI wiring ================= */
const micBtn = document.getElementById('mic');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const hintText = document.getElementById('hintText');

const gearBtn = document.getElementById('gearBtn');
const overlay = document.getElementById('overlay');
const closePanel = document.getElementById('closePanel');
const modeSwitch = document.getElementById('modeSwitch');
const modeSub = document.getElementById('modeSub');

let listenMode = 'auto'; // auto | manual

gearBtn.addEventListener('click', ()=> overlay.classList.add('open'));
closePanel.addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); });

modeSwitch.addEventListener('click', ()=>{
  listenMode = listenMode==='auto' ? 'manual' : 'auto';
  modeSwitch.classList.toggle('auto', listenMode==='auto');
  modeSub.textContent = listenMode==='auto' ? 'Auto — just start talking' : 'Manual — hold mic button to talk';
  hintText.textContent = listenMode==='auto'
    ? 'Auto mode: just talk. Voice runs on your browser\'s built-in speech engine.'
    : 'Manual mode: hold the mic button while you talk, release when done.';
  // restart listening loop cleanly on mode change
  if(recognizing){ try{ recognition.stop(); }catch(e){} }
});

function setStatus(s){ statusEl.textContent = s; }
function setMode(m){
  mode = m;
  targetLevel = m==='idle' ? 0 : 0.6;
  micBtn.classList.toggle('listening', m==='listening');
}
function addLine(who, text){
  const div = document.createElement('div');
  div.className = who;
  div.textContent = (who==='you' ? '> ' : '') + text;
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false;
let recognition = null;
let suppressRestart = false;

if(SR){
  recognition = new SR();
  recognition.lang = 'id-ID';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { recognizing = true; setMode('listening'); setStatus('LISTENING'); };
  recognition.onend = () => {
    recognizing = false;
    if(mode==='listening'){ setMode('idle'); setStatus('STANDBY'); }
    // auto mode: keep the ear open unless we're mid-response or user paused it
    if(listenMode==='auto' && !suppressRestart && mode!=='speaking'){
      setTimeout(()=>{ try{ recognition.start(); }catch(e){} }, 400);
    }
  };
  recognition.onerror = (e) => {
    setStatus('MIC ERROR: ' + e.error);
    setMode('idle');
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    addLine('you', text);
    handleQuery(text);
  };
} else {
  setStatus('SPEECH API NOT SUPPORTED');
}

function startListening(){
  if(!SR){ addLine('ai', 'This browser doesnt support Web Speech API.'); return; }
  suppressRestart = false;
  try{ recognition.start(); }catch(err){ /* already started */ }
}
function stopListening(){
  suppressRestart = true;
  if(recognition && recognizing){ recognition.stop(); }
}

// Manual mode: press and hold
micBtn.addEventListener('pointerdown', ()=>{
  if(listenMode!=='manual') return;
  startListening();
});
micBtn.addEventListener('pointerup', ()=>{
  if(listenMode!=='manual') return;
  stopListening();
});
micBtn.addEventListener('pointerleave', ()=>{
  if(listenMode!=='manual') return;
  stopListening();
});

// Auto mode: tap to kick things off (in case autoplay/mic policy needs a user gesture)
micBtn.addEventListener('click', ()=>{
  if(listenMode!=='auto') return;
  if(recognizing){ stopListening(); } else { startListening(); }
});

function speak(text){
  suppressRestart = true;
  if(recognition && recognizing){ try{ recognition.stop(); }catch(e){} }
  setMode('speaking');
  setStatus('RESPONDING');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'id-ID';
  utter.rate = 1.02;
  utter.onend = () => {
    setMode('idle'); setStatus('STANDBY');
    if(listenMode==='auto'){ suppressRestart = false; setTimeout(startListening, 300); }
  };
  utter.onerror = () => {
    setMode('idle'); setStatus('STANDBY');
    if(listenMode==='auto'){ suppressRestart = false; setTimeout(startListening, 300); }
  };
  speechSynthesis.speak(utter);
}

/* ---------- API key + Groq call ---------- */
let groqKey = '';
const apiKeyInput = document.getElementById('apiKey');
const saveKeyBtn = document.getElementById('saveKey');
saveKeyBtn.addEventListener('click', () => {
  groqKey = apiKeyInput.value.trim();
  overlay.classList.remove('open');
  if(groqKey){ addLine('ai', 'Key tersimpan buat sesi ini. Siap dipake.'); }
});

async function handleQuery(userText){
  if(!groqKey){
    addLine('ai', 'Belum ada API key. Buka Settings (ikon gear), masukin Groq API key, Save.');
    setMode('idle'); setStatus('STANDBY');
    return;
  }
  setStatus('THINKING');
  targetLevel = 0.35;
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization': 'Bearer ' + groqKey
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 300,
        messages: [
          { role:'system', content:'You are J.A.R.V.I.S, a concise voice assistant. Reply in Indonesian (bahasa gaul santai tapi sopan), max 2-3 short sentences, no markdown, since your reply will be read aloud by text-to-speech.' },
          { role:'user', content:userText }
        ]
      })
    });
    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content?.trim() || 'An error occured.';
    addLine('ai', text);
    speak(text);
  }catch(err){
    addLine('ai', '[Error connecting to AI. Please check your api]');
    setMode('idle'); setStatus('STANDBY');
  }
}
</script>
</body>
    </html>
